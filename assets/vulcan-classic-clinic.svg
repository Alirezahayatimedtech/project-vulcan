<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Vulcan — from clinic to intelligent clinic</title>
<desc id="desc">A classic old-print illustration showing a simple ophthalmology clinic on the left, Vulcan in the center, and a connected intelligent clinic on the right.</desc>
