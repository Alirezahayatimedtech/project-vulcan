[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulcan-health"
version = "0.1.0"
description = "Research prototype for AI-generated healthcare software and workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VULCAN Project"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulcan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
